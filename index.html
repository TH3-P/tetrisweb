<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETRIMANIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- PARTÍCULAS AMBIENTALES DE FONDO (puramente decorativo) -->
    <div class="bg-particles" aria-hidden="true">
        <span style="left:4%; width:3px; height:3px; background:#0DC2FF; animation-duration:14s; animation-delay:0s; --drift:24px;"></span>
        <span style="left:12%; width:2px; height:2px; background:#F538FF; animation-duration:11s; animation-delay:2s; --drift:-18px;"></span>
        <span style="left:20%; width:4px; height:4px; background:#FFE135; animation-duration:17s; animation-delay:1s; --drift:14px;"></span>
        <span style="left:30%; width:2px; height:2px; background:#0DC2FF; animation-duration:13s; animation-delay:4s; --drift:-22px;"></span>
        <span style="left:41%; width:3px; height:3px; background:#0DFF72; animation-duration:16s; animation-delay:3s; --drift:20px;"></span>
        <span style="left:52%; width:2px; height:2px; background:#F538FF; animation-duration:12s; animation-delay:6s; --drift:-16px;"></span>
        <span style="left:61%; width:4px; height:4px; background:#0DC2FF; animation-duration:18s; animation-delay:0.5s; --drift:18px;"></span>
        <span style="left:70%; width:2px; height:2px; background:#FFE135; animation-duration:15s; animation-delay:5s; --drift:-20px;"></span>
        <span style="left:79%; width:3px; height:3px; background:#F538FF; animation-duration:11s; animation-delay:2.5s; --drift:22px;"></span>
        <span style="left:87%; width:2px; height:2px; background:#0DFF72; animation-duration:14s; animation-delay:7s; --drift:-14px;"></span>
        <span style="left:93%; width:3px; height:3px; background:#0DC2FF; animation-duration:19s; animation-delay:3.5s; --drift:16px;"></span>
        <span style="left:96%; width:2px; height:2px; background:#FFE135; animation-duration:12.5s; animation-delay:1.5s; --drift:-24px;"></span>
    </div>

    <!-- OVERLAY CRT / SCANLINES -->
    <div class="crt-overlay" aria-hidden="true"></div>

    <!-- PANTALLA DE AUTENTICACIÓN -->
    <div id="screen-auth" class="screen active">
        <div class="auth-card">
            <h1 id="auth-title">TETRIMANIA</h1>
            <div id="auth-message"></div>
            <form id="auth-form" onsubmit="return false;">
                <input type="text" id="username" placeholder="Usuario" autocomplete="off" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <div class="auth-buttons">
                    <button type="submit" id="btn-login" class="btn-primary">Iniciar Sesión</button>
                    <button type="button" id="btn-register" class="btn-secondary">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PANTALLA DE MENÚ PRINCIPAL -->
    <div id="screen-menu" class="screen">

        <!-- DECORACIÓN DE FONDO (puramente decorativo) -->
        <div class="game-bg-decor" aria-hidden="true">
            <div class="retro-sun"></div>
            <div class="glow-shape s1"></div>
            <div class="glow-shape s2"></div>
            <div class="glow-shape s3"></div>
            <div class="glow-shape s4"></div>
            <div class="side-beam left"></div>
            <div class="side-beam right"></div>
        </div>

        <div class="menu-card">
            <h1>TETRIMANIA</h1>
            <p>Bienvenido, <strong id="user-display"></strong></p>

            <div class="menu-actions">
                <button id="btn-mode-arcade" class="btn-mode">🎮 Modo Arcade</button>
                <button id="btn-mode-bossrush" class="btn-mode">👾 Boss Rush</button>
                <button id="btn-mode-vs" class="btn-mode">⚔️ Modo VS IA</button>
                <div class="secondary-actions-row">
                    <button id="btn-settings-menu" class="btn-secondary">⚙️ Ajustes</button>
                    <button class="icon-btn btn-mute" title="Silenciar música">🔊</button>
                </div>
            </div>

            <div class="leaderboard-section">
                <h3>🏆 Tabla de Clasificación</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard">
                        <!-- Se llena mediante JS -->
                    </tbody>
                </table>
            </div>

            <button id="btn-logout" class="btn-danger" style="margin-top: 15px;">Cerrar Sesión</button>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="screen-game" class="screen">

        <!-- DECORACIÓN DE FONDO EXCLUSIVA DEL JUEGO (puramente decorativo) -->
        <div class="game-bg-decor" aria-hidden="true">
            <div class="retro-sun"></div>
            <div class="glow-shape s1"></div>
            <div class="glow-shape s2"></div>
            <div class="glow-shape s3"></div>
            <div class="glow-shape s4"></div>
            <div class="side-beam left"></div>
            <div class="side-beam right"></div>
        </div>

        <div class="header-bar">
            <h2 id="mode-title">🎮 MODO ARCADE</h2>
            <div class="header-actions">
                <button class="icon-btn btn-mute" title="Silenciar música">🔊</button>
                <button id="btn-settings-game" class="icon-btn">⚙️</button>
                <button id="btn-back-menu" class="icon-btn">🚪</button>
            </div>
        </div>

        <div class="game-container">
            <!-- PANEL IZQUIERDO: CONTROLES -->
            <div class="controls-panel">
                <h3>Controles</h3>
                <ul>
                    <li>Mover <span>← / →</span></li>
                    <li>Caer <span>↓</span></li>
                    <li>Rotar <span>↑</span></li>
                    <li>Drop Rápido <span>Z</span></li>
                    <li>Pausa <span>Espacio</span></li>
                </ul>
            </div>

            <!-- TABLERO CENTRAL -->
            <div class="canvas-frame">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
                <canvas id="tetris" width="240" height="400"></canvas>
            </div>

            <!-- PANEL DERECHO: ESTADÍSTICAS -->
            <div class="info-panel">
                <div class="info-box">
                    <p>PUNTOS</p>
                    <h3 id="score">0</h3>
                </div>
                <div class="info-box">
                    <p>NIVEL</p>
                    <h3 id="level">1</h3>
                </div>
                <div class="info-box">
                    <p>SIGUIENTE</p>
                    <canvas id="next" width="80" height="80"></canvas>
                </div>
                <button id="pause-btn" class="btn-secondary">Pausa</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE AJUSTES -->
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>⚙️ Ajustes</h2>
            <div class="setting-item">
                <label for="speed-slider">Velocidad Base:</label>
                <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">
                <span id="speed-value-display">x1</span>
            </div>
            <div class="setting-item">
                <label for="volume-slider">🎵 Volumen de Música:</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.45">
                <span id="volume-value-display">45%</span>
            </div>
            <button id="btn-close-settings" class="btn-primary">Guardar y Cerrar</button>
        </div>
    </div>

    <!-- MODAL GAME OVER -->
    <div id="gameover-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 style="color: #FF0D72;">💥 FIN DEL JUEGO</h2>
            <p>¡Te has quedado sin espacio!</p>
            <div class="modal-buttons">
                <button id="btn-retry" class="btn-primary">Reintentar</button>
                <button id="btn-gameover-menu" class="btn-secondary">Menú Principal</button>
            </div>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="effects.js"></script>
    <script src="game.js"></script>
</body>
</html>
