<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Local PHP + MySQL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Panel Izquierdo: Juego Tetris -->
        <div class="game-area">
            <canvas id="tetris" width="240" height="400"></canvas>
            
            <div class="side-panel">
                <div class="panel-box">
                    <h3>Siguiente</h3>
                    <canvas id="next" width="80" height="80"></canvas>
                </div>
                
                <div class="panel-box">
                    <h3>Puntuación</h3>
                    <p id="score">0</p>
                    <h3>Nivel</h3>
                    <p id="level">1</p>
                </div>

                <button id="pause-btn" class="btn">Pausar (P)</button>
            </div>
        </div>

        <!-- Panel Derecho: Usuario y Clasificación -->
        <div class="sidebar">
            <!-- Autenticación -->
            <div id="auth-panel" class="card">
                <h2>Iniciar Sesión</h2>
                <input type="text" id="username" placeholder="Usuario" autocomplete="off">
                <input type="password" id="password" placeholder="Contraseña">
                <div class="btn-group">
                    <button id="btn-login" class="btn primary">Entrar</button>
                    <button id="btn-register" class="btn secondary">Registrarse</button>
                </div>
                <p id="auth-message"></p>
            </div>

            <!-- Usuario Activo -->
            <div id="user-panel" class="card" style="display: none;">
                <h2>Bienvenido, <span id="user-display"></span>!</h2>
                <button id="btn-logout" class="btn danger">Cerrar Sesión</button>
            </div>

            <!-- Tabla de Liderazgo -->
            <div class="card">
                <h2>Mejores Puntuaciones</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Jugador</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard">
                        <!-- Se llena dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
