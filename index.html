<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Web - SQL Connection</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: sans-serif;
            font-size: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding: 20px;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .box {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            border: 2px solid #333;
            width: 200px;
        }
        canvas {
            border: solid 2px #fff;
            background-color: #000;
        }
        input, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 3px;
            border: none;
        }
        button {
            background: #0DC2FF;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border-bottom: 1px solid #333;
            padding: 5px;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- Panel Lateral Izquierdo: Estado del Jugador / Autenticación -->
    <div class="panel">
        <div id="auth-panel" class="box" style="display: flex; flex-direction: column;">
            <h4 style="margin: 0 0 10px 0;">Cuenta de Jugador</h4>
            <input type="text" id="username" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button type="button" id="btn-login">Entrar</button>
            <button type="button" id="btn-register" style="background:#0DFF72">Registrarse</button>

            <!-- Contenedor para mensajes de error o éxito sin ventanas tipo alert() -->
            <div id="auth-message" style="margin-top: 8px; font-size: 12px; font-weight: bold; min-height: 18px;"></div>
        </div>

        <div id="user-panel" class="box" style="display: none;">
            <h4>¡Hola, <span id="user-display"></span>!</h4>
            <button type="button" id="btn-logout" style="background:#FF5555; color:#fff;">Cerrar Sesión</button>
        </div>

        <div class="box">
            <h4>Puntuación: <span id="score">0</span></h4>
            <h4>Nivel: <span id="level">1</span></h4>
            <button type="button" id="pause-btn">Pausar (P)</button>
        </div>
    </div>

    <!-- Tablero Principal del Tetris -->
    <div>
        <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <!-- Panel Lateral Derecho: Pieza Siguiente y Clasificación -->
    <div class="panel">
        <div class="box">
            <h4 style="margin: 0 0 10px 0;">Siguiente</h4>
            <canvas id="next" width="80" height="80"></canvas>
        </div>

        <div class="box">
            <h4 style="margin: 0 0 5px 0;">Top 5 Puntuaciones</h4>
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="leaderboard">
                    <!-- Se rellena automáticamente con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
