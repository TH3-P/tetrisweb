<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tetris Web + XAMPP</title>
    <style>
        body { background: #202028; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: flex-start; gap: 20px; padding-top: 20px; }
        canvas { border: 2px solid #fff; background-color: #000; }
        .panel { display: flex; flex-direction: column; gap: 12px; width: 250px; }
        .box { background: #333; padding: 12px; border-radius: 5px; display: flex; flex-direction: column; gap: 8px; }
        input, button { padding: 8px; border: none; border-radius: 3px; }
        button { background: #0DC2FF; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #555; padding: 6px; text-align: left; }
    </style>
</head>
<body>

    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="panel">
        <h2>Tetris XAMPP</h2>
        
        <!-- Formulario de Registro / Login -->
        <div id="auth-panel" class="box">
    <h4>Cuenta de Jugador</h4>
    <input type="text" id="username" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button type="button" id="btn-login">Entrar</button>
    <button type="button" id="btn-register" style="background:#0DFF72">Registrarse</button>

    <!-- AQUÍ SE MOSTRARÁN LOS MENSAJES (Sin ventanas emergentes) -->
    <div id="auth-message" style="margin-top: 5px; font-size: 13px; font-weight: bold; min-height: 18px;"></div>
</div>

        <!-- Estado del Juego -->
        <div class="box">
            <div>
                <span>Siguiente:</span>
                <canvas id="next" width="80" height="80" style="display:block; margin-top:5px;"></canvas>
            </div>
            <h3>Puntos: <span id="score">0</span></h3>
            <h3>Nivel: <span id="level">1</span></h3>
            <button type="button" id="pause-btn" onclick="togglePause()" style="background: #FFE135; color: #000;">Pausar (P)</button>
        </div>

        <!-- Leaderboard -->
        <div>
            <h4>Top 5 Mejores Puntuaciones</h4>
            <table>
                <thead><tr><th>Jugador</th><th>Puntos</th></tr></thead>
                <tbody id="leaderboard"></tbody>
            </table>
        </div>
    </div>

<!-- Cargar el script del juego al final del documento -->
<script src="game.js"></script>
</body>
</html>
